<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Student Worksheets Portal</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        /* Student Info Section */
        .student-info {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: 600;
            color: #555;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        .form-group input {
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }

        /* Section Titles */
        .section-title {
            color: white;
            font-size: 1.8rem;
            margin-bottom: 20px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
        }

        /* Cards Grid */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .worksheet-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .worksheet-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        .card-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .card-icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            font-size: 1.5rem;
        }

        .icon-kwq {
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .icon-assessment {
            background: linear-gradient(135deg, #f093fb, #f5576c);
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #333;
        }

        .card-description {
            color: #666;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .unit-badge {
            background: #f0f0f0;
            color: #555;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .open-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .open-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        /* Worksheet View */
        .hidden {
            display: none !important;
        }

        .worksheet-view {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .worksheet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
        }

        .back-btn {
            background: #f0f0f0;
            color: #333;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
        }

        .back-btn:hover {
            background: #e0e0e0;
        }

        .worksheet-meta {
            color: #666;
            font-size: 0.95rem;
        }

        .worksheet-content {
            margin-bottom: 30px;
        }

        .question-block {
            background: #f8f9ff;
            border-left: 4px solid #667eea;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
        }

        .question-text {
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            font-size: 1.1rem;
        }

        .answer-input {
            width: 100%;
            min-height: 100px;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
            resize: vertical;
            transition: border-color 0.3s;
        }

        .answer-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .multiple-choice {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .choice-label {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .choice-label:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }

        .choice-label input[type="radio"] {
            margin-right: 12px;
            width: 18px;
            height: 18px;
        }

        .choice-label.selected {
            border-color: #667eea;
            background: #f8f9ff;
        }

        /* Action Buttons */
        .worksheet-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 20px;
            border-top: 2px solid #f0f0f0;
            flex-wrap: wrap;
            gap: 15px;
        }

        .action-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .action-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .action-btn.secondary {
            background: #f0f0f0;
            color: #333;
        }

        .action-btn.secondary:hover {
            background: #e0e0e0;
        }

        .action-btn.info {
            background: #17a2b8;
            color: white;
        }

        .action-btn.info:hover {
            background: #138496;
        }

        .action-btn.success {
            background: linear-gradient(135deg, #11998e, #38ef7d);
            color: white;
        }

        .action-btn.success:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(17, 153, 142, 0.4);
        }

        /* Modal */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            max-width: 500px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .success-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #11998e, #38ef7d);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 2.5rem;
            color: white;
        }

        .modal-content h3 {
            color: #333;
            font-size: 1.8rem;
            margin-bottom: 15px;
        }

        .summary-box {
            background: #f8f9ff;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: left;
        }

        .summary-box p {
            margin-bottom: 10px;
            color: #555;
        }

        .status-badge {
            background: #38ef7d;
            color: white;
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .close-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 40px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        .close-btn:hover {
            background: #5568d3;
        }

        /* Responsive */
        @media (max-width: 768px) {
            header h1 {
                font-size: 2rem;
            }

            .cards-grid {
                grid-template-columns: 1fr;
            }

            .info-grid {
                grid-template-columns: 1fr;
            }

            .worksheet-header {
                flex-direction: column;
                gap: 15px;
            }

            .worksheet-actions {
                flex-direction: column;
            }

            .action-group {
                width: 100%;
                justify-content: center;
            }
        }

        /* Print Styles */
        @media print {
            body {
                background: white;
                padding: 0;
            }

            .student-info, .cards-grid, .section-title, .worksheet-actions, .back-btn {
                display: none !important;
            }

            .worksheet-view {
                box-shadow: none;
                padding: 0;
            }

            .question-block {
                break-inside: avoid;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-graduation-cap"></i> Digital Worksheets Portal</h1>
            <p>Interactive Learning Platform - Complete, Share, Print & Submit</p>
        </header>

        <!-- Student Info Section -->
        <section class="student-info" id="studentInfoSection">
            <h2><i class="fas fa-user"></i> Student Information</h2>
            <div class="info-grid">
                <div class="form-group">
                    <label for="studentName">Student Name</label>
                    <input type="text" id="studentName" placeholder="Enter your full name">
                </div>
                <div class="form-group">
                    <label for="studentDate">Date</label>
                    <input type="date" id="studentDate">
                </div>
            </div>
        </section>

        <!-- Card View -->
        <main id="cardView">
            <section class="worksheets-section">
                <h2 class="section-title"><i class="fas fa-book-open"></i> Knowledge & Wisdom Questions</h2>
                <div class="cards-grid" id="kwq-cards"></div>
            </section>

            <section class="worksheets-section">
                <h2 class="section-title"><i class="fas fa-clipboard-check"></i> Assessments</h2>
                <div class="cards-grid" id="assessment-cards"></div>
            </section>
        </main>

        <!-- Live Worksheet View -->
        <main id="worksheetView" class="worksheet-view hidden">
            <div class="worksheet-header">
                <button class="back-btn" onclick="showCardView()">
                    <i class="fas fa-arrow-left"></i> Back to Lessons
                </button>
                <div class="worksheet-meta">
                    <span id="displayStudentName"></span> | <span id="displayDate"></span>
                </div>
            </div>

            <div class="worksheet-content" id="worksheetContent">
                <!-- Dynamic content loads here -->
            </div>

            <div class="worksheet-actions">
                <button onclick="viewPDFReference()" class="action-btn info">
                    <i class="fas fa-file-pdf"></i> View PDF Reference
                </button>
                <div class="action-group">
                    <button onclick="printWorksheet()" class="action-btn secondary">
                        <i class="fas fa-print"></i> Print
                    </button>
                    <button onclick="shareWorksheet()" class="action-btn secondary">
                        <i class="fas fa-share-alt"></i> Share
                    </button>
                    <button onclick="submitWorksheet()" class="action-btn success">
                        <i class="fas fa-paper-plane"></i> Submit Work
                    </button>
                </div>
            </div>
        </main>
    </div>

    <!-- Success Modal -->
    <div class="modal" id="successModal">
        <div class="modal-content">
            <div class="success-icon"><i class="fas fa-check-circle"></i></div>
            <h3>Submission Successful!</h3>
            <div class="summary-box" id="submissionSummary"></div>
            <button class="close-btn" onclick="closeModal()">Done</button>
        </div>
    </div>

    <script>
        // Worksheet data with interactive content
        const worksheets = {
            kwq: [
                { unit: 'Unit 1', file: 'OSW_LS6_KWQ_U1.pdf', title: 'Knowledge & Wisdom Q - Unit 1', description: 'Complete the knowledge and wisdom questions for Unit 1' },
                { unit: 'Unit 2', file: 'OSW_LS6_KWQ_U2.pdf', title: 'Knowledge & Wisdom Q - Unit 2', description: 'Complete the knowledge and wisdom questions for Unit 2' },
                { unit: 'Unit 3', file: 'OSW_LS6_KWQ_U3.pdf', title: 'Knowledge & Wisdom Q - Unit 3', description: 'Complete the knowledge and wisdom questions for Unit 3' },
                { unit: 'Unit 4', file: 'OSW_LS6_KWQ_U4.pdf', title: 'Knowledge & Wisdom Q - Unit 4', description: 'Complete the knowledge and wisdom questions for Unit 4' },
                { unit: 'Unit 5', file: 'OSW_LS6_KWQ_U5.pdf', title: 'Knowledge & Wisdom Q - Unit 5', description: 'Complete the knowledge and wisdom questions for Unit 5' },
                { unit: 'Unit 6', file: 'OSW_LS6_KWQ_U6.pdf', title: 'Knowledge & Wisdom Q - Unit 6', description: 'Complete the knowledge and wisdom questions for Unit 6' },
                { unit: 'Unit 7', file: 'OSW_LS6_KWQ_U7.pdf', title: 'Knowledge & Wisdom Q - Unit 7', description: 'Complete the knowledge and wisdom questions for Unit 7' },
                { unit: 'Unit 8', file: 'OSW_LS6_KWQ_U8.pdf', title: 'Knowledge & Wisdom Q - Unit 8', description: 'Complete the knowledge and wisdom questions for Unit 8' },
                { unit: 'Unit 9', file: 'OSW_LS6_KWQ_U9.pdf', title: 'Knowledge & Wisdom Q - Unit 9', description: 'Complete the knowledge and wisdom questions for Unit 9' },
                { unit: 'Unit 10', file: 'OSW_LS6_KWQ_U10.pdf', title: 'Knowledge & Wisdom Q - Unit 10', description: 'Complete the knowledge and wisdom questions for Unit 10' },
                { unit: 'Unit 11', file: 'OSW_LS6_KWQ_U11.pdf', title: 'Knowledge & Wisdom Q - Unit 11', description: 'Complete the knowledge and wisdom questions for Unit 11' },
                { unit: 'Unit 12', file: 'OSW_LS6_KWQ_U12.pdf', title: 'Knowledge & Wisdom Q - Unit 12', description: 'Complete the knowledge and wisdom questions for Unit 12' }
            ],
            assessment: [
                { unit: 'Answer Key', file: 'OSW_LS6_Assessment_AK.pdf', title: 'Level 6 Assessment Answer Key', description: 'Reference answer key for Level 6 assessments' }
            ]
        };

        let currentWorksheet = null;
        let studentAnswers = {};

        // Set today's date as default
        document.addEventListener('DOMContentLoaded', function() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('studentDate').value = today;
            renderCards();
        });

        // Render worksheet cards
        function renderCards() {
            const kwqContainer = document.getElementById('kwq-cards');
            const assessmentContainer = document.getElementById('assessment-cards');

            worksheets.kwq.forEach((ws, index) => {
                const card = createCard(ws, 'kwq', index);
                kwqContainer.appendChild(card);
            });

            worksheets.assessment.forEach((ws, index) => {
                const card = createCard(ws, 'assessment', index);
                assessmentContainer.appendChild(card);
            });
        }

        // Create card element
        function createCard(worksheet, type, index) {
            const card = document.createElement('div');
            card.className = 'worksheet-card';
            
            const iconClass = type === 'kwq' ? 'icon-kwq' : 'icon-assessment';
            const icon = type === 'kwq' ? '📖' : '✅';

            card.innerHTML = `
                <div>
                    <div class="card-header">
                        <div class="card-icon ${iconClass}">${icon}</div>
                        <div class="card-title">${worksheet.title}</div>
                    </div>
                    <p class="card-description">${worksheet.description}</p>
                </div>
                <div class="card-footer">
                    <span class="unit-badge">${worksheet.unit}</span>
                    <button class="open-btn" onclick="event.stopPropagation(); openWorksheet('${type}', ${index})">
                        <i class="fas fa-pencil-alt"></i> Start Worksheet
                    </button>
                </div>
            `;

            return card;
        }

        // Open interactive worksheet
        function openWorksheet(type, index) {
            const worksheet = worksheets[type][index];
            currentWorksheet = worksheet;
            studentAnswers = {};

            // Hide card view, show worksheet view
            document.getElementById('cardView').classList.add('hidden');
            document.getElementById('studentInfoSection').classList.add('hidden');
            document.getElementById('worksheetView').classList.remove('hidden');

            // Update header info
            const name = document.getElementById('studentName').value || 'Student';
            const date = document.getElementById('studentDate').value || new Date().toISOString().split('T')[0];
            document.getElementById('displayStudentName').textContent = name;
            document.getElementById('displayDate').textContent = date;

            // Generate interactive content
            generateWorksheetContent(worksheet);
            
            window.scrollTo(0, 0);
        }

        // Generate interactive worksheet content
        function generateWorksheetContent(worksheet) {
            const container = document.getElementById('worksheetContent');
            const unitNum = worksheet.unit.replace('Unit ', '') || '1';
            
            let html = `
                <h2 style="margin-bottom: 25px; color: #333;">${worksheet.title}</h2>
                <p style="color: #666; margin-bottom: 30px;">Complete all questions below. Your answers will be saved automatically.</p>
            `;

            // Generate sample questions (in real app, parse from PDF or have predefined questions)
            for (let i = 1; i <= 5; i++) {
                html += `
                    <div class="question-block">
                        <div class="question-text">Question ${i}: Explain the key concepts learned in ${worksheet.unit}.</div>
                        <textarea class="answer-input" 
                                  id="answer${i}" 
                                  placeholder="Type your answer here..."
                                  oninput="saveAnswer(${i}, this.value)"></textarea>
                    </div>
                `;
                studentAnswers[i] = '';
            }

            // Add multiple choice example
            html += `
                <div class="question-block">
                    <div class="question-text">Question 6: Which statement best summarizes ${worksheet.unit}?</div>
                    <div class="multiple-choice">
                        <label class="choice-label" onclick="selectChoice(this, 6, 'A')">
                            <input type="radio" name="q6" value="A">
                            A) The primary focus is on foundational skills
                        </label>
                        <label class="choice-label" onclick="selectChoice(this, 6, 'B')">
                            <input type="radio" name="q6" value="B">
                            B) Advanced applications are emphasized
                        </label>
                        <label class="choice-label" onclick="selectChoice(this, 6, 'C')">
                            <input type="radio" name="q6" value="C">
                            C) Both theory and practice are integrated
                        </label>
                        <label class="choice-label" onclick="selectChoice(this, 6, 'D')">
                            <input type="radio" name="q6" value="D">
                            D) Independent study is required
                        </label>
                    </div>
                </div>
            `;

            container.innerHTML = html;
        }

        // Save answer
        function saveAnswer(questionNum, value) {
            studentAnswers[questionNum] = value;
        }

        // Select multiple choice
        function selectChoice(label, questionNum, value) {
            // Remove selected from siblings
            const parent = label.parentElement;
            parent.querySelectorAll('.choice-label').forEach(l => {
                l.classList.remove('selected');
                l.querySelector('input').checked = false;
            });
            
            // Add selected to clicked
            label.classList.add('selected');
            label.querySelector('input').checked = true;
            studentAnswers[questionNum] = value;
        }

        // Show card view
        function showCardView() {
            document.getElementById('worksheetView').classList.add('hidden');
            document.getElementById('cardView').classList.remove('hidden');
            document.getElementById('studentInfoSection').classList.remove('hidden');
            currentWorksheet = null;
        }

        // View PDF reference
        function viewPDFReference() {
            if (currentWorksheet && currentWorksheet.file) {
                window.open(currentWorksheet.file, '_blank');
            }
        }

        // Print worksheet
        function printWorksheet() {
            window.print();
        }

        // Share worksheet
        async function shareWorksheet() {
            if (!currentWorksheet) return;

            const shareData = {
                title: currentWorksheet.title,
                text: `Check out this worksheet: ${currentWorksheet.title}`,
                url: window.location.href
            };

            if (navigator.share) {
                try {
                    await navigator.share(shareData);
                } catch (err) {
                    console.log('Share canceled');
                }
            } else {
                // Fallback: copy to clipboard
                navigator.clipboard.writeText(`${shareData.text} - ${shareData.url}`)
                    .then(() => alert('Link copied to clipboard!'))
                    .catch(() => alert('Unable to share. Please copy the URL manually.'));
            }
        }

        // Submit worksheet
        function submitWorksheet() {
            const studentName = document.getElementById('studentName').value.trim();
            const studentDate = document.getElementById('studentDate').value;

            if (!studentName) {
                alert('Please enter your name first');
                showCardView();
                return;
            }

            if (!studentDate) {
                alert('Please select a date first');
                showCardView();
                return;
            }

            // Check if any answers provided
            const hasAnswers = Object.values(studentAnswers).some(a => a && a.trim() !== '');
            if (!hasAnswers) {
                alert('Please complete at least one question before submitting');
                return;
            }

            // Show success modal
            const summary = document.getElementById('submissionSummary');
            summary.innerHTML = `
                <p><strong>Student:</strong> ${studentName}</p>
                <p><strong>Date:</strong> ${studentDate}</p>
                <p><strong>Lesson:</strong> ${currentWorksheet.title}</p>
                <p><strong>Unit:</strong> ${currentWorksheet.unit}</p>
                <p><strong>Questions Answered:</strong> ${Object.values(studentAnswers).filter(a => a).length}</p>
                <p><strong>Status:</strong> <span class="status-badge">Submitted</span></p>
            `;
            
            document.getElementById('successModal').classList.add('active');

            // Log submission (in real app, send to server)
            console.log('Submission:', {
                student: studentName,
                date: studentDate,
                worksheet: currentWorksheet.title,
                unit: currentWorksheet.unit,
                answers: studentAnswers,
                timestamp: new Date().toISOString()
            });
        }

        // Close modal
        function closeModal() {
            document.getElementById('successModal').classList.remove('active');
            showCardView();
        }

        // Close modal when clicking outside
        document.getElementById('successModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });
    </script>
</body>
</html>
