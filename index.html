<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Worksheets Portal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        /* Student Info Section */
        .student-info {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .student-info h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: 600;
            color: #555;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        .form-group input {
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }

        /* Worksheet Cards Section */
        .worksheets-section {
            margin-bottom: 30px;
        }

        .section-title {
            color: white;
            font-size: 1.8rem;
            margin-bottom: 20px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .worksheet-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .worksheet-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        .card-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .card-icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            font-size: 1.5rem;
        }

        .icon-kwq {
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .icon-assessment {
            background: linear-gradient(135deg, #f093fb, #f5576c);
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #333;
        }

        .card-description {
            color: #666;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .unit-badge {
            background: #f0f0f0;
            color: #555;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .open-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .open-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        /* Submit Section */
        .submit-section {
            background: white;
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .submit-section h2 {
            color: #333;
            margin-bottom: 15px;
        }

        .submit-section p {
            color: #666;
            margin-bottom: 25px;
        }

        .submit-btn {
            background: linear-gradient(135deg, #11998e, #38ef7d);
            color: white;
            border: none;
            padding: 15px 50px;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 5px 20px rgba(17, 153, 142, 0.4);
        }

        .submit-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 30px rgba(17, 153, 142, 0.6);
        }

        .submit-btn:active {
            transform: scale(0.98);
        }

        /* Success Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            max-width: 500px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .success-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #11998e, #38ef7d);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 2.5rem;
            color: white;
        }

        .modal-content h3 {
            color: #333;
            font-size: 1.8rem;
            margin-bottom: 15px;
        }

        .modal-content p {
            color: #666;
            margin-bottom: 25px;
            font-size: 1.1rem;
        }

        .close-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 40px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        .close-btn:hover {
            background: #5568d3;
        }

        /* Responsive */
        @media (max-width: 768px) {
            header h1 {
                font-size: 2rem;
            }

            .cards-grid {
                grid-template-columns: 1fr;
            }

            .info-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📚 Digital Worksheets Portal</h1>
            <p>Select your worksheet, complete it, and submit when finished</p>
        </header>

        <!-- Student Information Section -->
        <section class="student-info">
            <h2>👤 Student Information</h2>
            <div class="info-grid">
                <div class="form-group">
                    <label for="studentName">Student Name</label>
                    <input type="text" id="studentName" placeholder="Enter your full name" required>
                </div>
                <div class="form-group">
                    <label for="studentDate">Date</label>
                    <input type="date" id="studentDate" required>
                </div>
            </div>
        </section>

        <!-- Knowledge & Wisdom Questions Section -->
        <section class="worksheets-section">
            <h2 class="section-title">📝 Knowledge & Wisdom Questions</h2>
            <div class="cards-grid" id="kwq-cards">
                <!-- Cards will be generated by JavaScript -->
            </div>
        </section>

        <!-- Assessment Section -->
        <section class="worksheets-section">
            <h2 class="section-title">✅ Assessments</h2>
            <div class="cards-grid" id="assessment-cards">
                <!-- Cards will be generated by JavaScript -->
            </div>
        </section>

        <!-- Submit Section -->
        <section class="submit-section">
            <h2>Ready to Submit?</h2>
            <p>Make sure you've filled in your information and completed your worksheet</p>
            <button class="submit-btn" onclick="handleSubmit()">Submit Worksheet</button>
        </section>
    </div>

    <!-- Success Modal -->
    <div class="modal" id="successModal">
        <div class="modal-content">
            <div class="success-icon">✓</div>
            <h3>Submission Successful!</h3>
            <p id="submissionDetails"></p>
            <button class="close-btn" onclick="closeModal()">Close</button>
        </div>
    </div>

    <script>
        // Worksheet data organized by type
        const worksheets = {
            kwq: [
                { unit: 'Unit 1', file: 'OSW_LS6_KWQ_U1.pdf', title: 'Knowledge & Wisdom Q - Unit 1', description: 'Complete the knowledge and wisdom questions for Unit 1' },
                { unit: 'Unit 2', file: 'OSW_LS6_KWQ_U2.pdf', title: 'Knowledge & Wisdom Q - Unit 2', description: 'Complete the knowledge and wisdom questions for Unit 2' },
                { unit: 'Unit 3', file: 'OSW_LS6_KWQ_U3.pdf', title: 'Knowledge & Wisdom Q - Unit 3', description: 'Complete the knowledge and wisdom questions for Unit 3' },
                { unit: 'Unit 4', file: 'OSW_LS6_KWQ_U4.pdf', title: 'Knowledge & Wisdom Q - Unit 4', description: 'Complete the knowledge and wisdom questions for Unit 4' },
                { unit: 'Unit 5', file: 'OSW_LS6_KWQ_U5.pdf', title: 'Knowledge & Wisdom Q - Unit 5', description: 'Complete the knowledge and wisdom questions for Unit 5' },
                { unit: 'Unit 6', file: 'OSW_LS6_KWQ_U6.pdf', title: 'Knowledge & Wisdom Q - Unit 6', description: 'Complete the knowledge and wisdom questions for Unit 6' },
                { unit: 'Unit 7', file: 'OSW_LS6_KWQ_U7.pdf', title: 'Knowledge & Wisdom Q - Unit 7', description: 'Complete the knowledge and wisdom questions for Unit 7' },
                { unit: 'Unit 8', file: 'OSW_LS6_KWQ_U8.pdf', title: 'Knowledge & Wisdom Q - Unit 8', description: 'Complete the knowledge and wisdom questions for Unit 8' },
                { unit: 'Unit 9', file: 'OSW_LS6_KWQ_U9.pdf', title: 'Knowledge & Wisdom Q - Unit 9', description: 'Complete the knowledge and wisdom questions for Unit 9' },
                { unit: 'Unit 10', file: 'OSW_LS6_KWQ_U10.pdf', title: 'Knowledge & Wisdom Q - Unit 10', description: 'Complete the knowledge and wisdom questions for Unit 10' },
                { unit: 'Unit 11', file: 'OSW_LS6_KWQ_U11.pdf', title: 'Knowledge & Wisdom Q - Unit 11', description: 'Complete the knowledge and wisdom questions for Unit 11' },
                { unit: 'Unit 12', file: 'OSW_LS6_KWQ_U12.pdf', title: 'Knowledge & Wisdom Q - Unit 12', description: 'Complete the knowledge and wisdom questions for Unit 12' }
            ],
            assessment: [
                { unit: 'Answer Key', file: 'OSW_LS6_Assessment_AK.pdf', title: 'Level 6 Assessment Answer Key', description: 'Reference answer key for Level 6 assessments' }
            ]
        };

        let selectedWorksheet = null;

        // Set today's date as default
        document.addEventListener('DOMContentLoaded', function() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('studentDate').value = today;
            
            renderCards();
        });

        // Render worksheet cards
        function renderCards() {
            const kwqContainer = document.getElementById('kwq-cards');
            const assessmentContainer = document.getElementById('assessment-cards');

            // Render KWQ cards
            worksheets.kwq.forEach((worksheet, index) => {
                const card = createCard(worksheet, 'kwq', index);
                kwqContainer.appendChild(card);
            });

            // Render Assessment cards
            worksheets.assessment.forEach((worksheet, index) => {
                const card = createCard(worksheet, 'assessment', index);
                assessmentContainer.appendChild(card);
            });
        }

        // Create card element
        function createCard(worksheet, type, index) {
            const card = document.createElement('div');
            card.className = 'worksheet-card';
            card.onclick = (e) => {
                // Prevent opening when clicking the button (button has its own handler)
                if (!e.target.classList.contains('open-btn')) {
                    selectWorksheet(worksheet, type, e);
                }
            };

            const iconClass = type === 'kwq' ? 'icon-kwq' : 'icon-assessment';
            const icon = type === 'kwq' ? '📖' : '✅';

            card.innerHTML = `
                <div>
                    <div class="card-header">
                        <div class="card-icon ${iconClass}">${icon}</div>
                        <div class="card-title">${worksheet.title}</div>
                    </div>
                    <p class="card-description">${worksheet.description}</p>
                </div>
                <div class="card-footer">
                    <span class="unit-badge">${worksheet.unit}</span>
                    <button class="open-btn" onclick="openWorksheet('${worksheet.file}', '${worksheet.title.replace(/'/g, "\\'")}')">Open Worksheet</button>
                </div>
            `;

            return card;
        }

        // Open worksheet PDF
        function openWorksheet(file, title) {
            console.log('Opening:', file);
            // Open the PDF file in a new tab
            window.open(file, '_blank');
        }

        // Select worksheet
        function selectWorksheet(worksheet, type, event) {
            selectedWorksheet = worksheet;
            
            // Remove active class from all cards
            document.querySelectorAll('.worksheet-card').forEach(card => {
                card.style.border = 'none';
                card.style.background = 'white';
            });

            // Add visual feedback to selected card
            if (event && event.currentTarget) {
                event.currentTarget.style.border = '3px solid #667eea';
                event.currentTarget.style.background = '#f8f9ff';
            }

            console.log('Selected:', worksheet.title);
        }

        // Handle form submission
        function handleSubmit() {
            const studentName = document.getElementById('studentName').value.trim();
            const studentDate = document.getElementById('studentDate').value;

            // Validation
            if (!studentName) {
                alert('Please enter your name');
                document.getElementById('studentName').focus();
                return;
            }

            if (!studentDate) {
                alert('Please select a date');
                document.getElementById('studentDate').focus();
                return;
            }

            if (!selectedWorksheet) {
                alert('Please select a worksheet first');
                return;
            }

            // Show success modal
            const modal = document.getElementById('successModal');
            const details = document.getElementById('submissionDetails');
            details.innerHTML = `
                <strong>Student:</strong> ${studentName}<br>
                <strong>Date:</strong> ${studentDate}<br>
                <strong>Worksheet:</strong> ${selectedWorksheet.title}<br>
                <strong>Unit:</strong> ${selectedWorksheet.unit}
            `;
            modal.classList.add('active');

            // Log submission (in real app, this would send to server)
            console.log('Submission:', {
                student: studentName,
                date: studentDate,
                worksheet: selectedWorksheet.title,
                unit: selectedWorksheet.unit,
                timestamp: new Date().toISOString()
            });
        }

        // Close modal
        function closeModal() {
            document.getElementById('successModal').classList.remove('active');
            // Reset selection
            selectedWorksheet = null;
            document.querySelectorAll('.worksheet-card').forEach(card => {
                card.style.border = 'none';
                card.style.background = 'white';
            });
        }

        // Close modal when clicking outside
        document.getElementById('successModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });
    </script>
</body>
</html>
